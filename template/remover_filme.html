{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remover {{ filme.titulo }} - CineBusca</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

  <header class="cabecalho cabecalho-simples cabecalho-nav">
    <a href="{% url 'buscar_filmes' %}" class="marca">🎬 CineBusca</a>
    <nav class="menu">
      <a href="{% url 'buscar_filmes' %}">Buscar</a>
      <a href="{% url 'minha_lista' %}" class="ativo">Minha lista</a>
    </nav>
  </header>

  <main class="conteudo conteudo-estreito">

    <section class="caixa confirmacao">
      <h1>Remover “{{ filme.titulo }}” da sua lista?</h1>
      <p class="resultado">Essa ação não pode ser desfeita.</p>

      <form method="post" class="botoes">
        {% csrf_token %}
        <button type="submit" class="botao botao-perigo">Sim, remover</button>
        <a href="{% url 'minha_lista' %}" class="botao botao-secundario">Não, voltar</a>
      </form>
    </section>

  </main>

  <footer class="rodape">Dados fornecidos pela API do OMDb</footer>

</body>

</html>
