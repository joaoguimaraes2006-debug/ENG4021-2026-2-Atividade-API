{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar {{ filme.titulo }} - CineBusca</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

  <header class="cabecalho cabecalho-simples cabecalho-nav">
    <a href="{% url 'buscar_filmes' %}" class="marca">🎬 CineBusca</a>
    <nav class="menu">
      <a href="{% url 'buscar_filmes' %}">Buscar</a>
      <a href="{% url 'minha_lista' %}" class="ativo">Minha lista</a>
    </nav>
  </header>

  <main class="conteudo conteudo-estreito">

    <a class="voltar" href="{% url 'minha_lista' %}">‹ Voltar para a minha lista</a>

    <section class="caixa">
      <h1>Editar “{{ filme.titulo }}”</h1>
      <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_div }}
        <div class="botoes">
          <button type="submit" class="botao">Salvar alterações</button>
          <a href="{% url 'minha_lista' %}" class="botao botao-secundario">Cancelar</a>
        </div>
      </form>
    </section>

  </main>

  <footer class="rodape">Dados fornecidos pela API do OMDb</footer>

</body>

</html>
